[project]
name = "okeef"
version = "0.1.0"
description = "Local-first OKF/PARA personal knowledgebase ingestion pipeline"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "PyYAML>=6.0",
    "python-frontmatter>=1.1",
    "PyMuPDF>=1.24",
    "python-docx>=1.1",
    "watchdog>=4.0",
    "ollama>=0.3",
    "click>=8.1",
    "python-dotenv>=1.0",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
okeef = "okeef.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
